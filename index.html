<!DOCTYPE html>
      <html lang="hi">
      <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width,initial-scale=1">
      <title>Surf Admin</title>
      <style>
      *{box-sizing:border-box}
      body{margin:0;background:#101114;color:white;font-family:Arial;padding:20px}
      .card{max-width:450px;margin:35px auto;background:#202127;padding:22px;border-radius:14px}
      input,button{width:100%;padding:14px;margin-top:12px;border-radius:8px}
      input{background:#30313a;color:white;border:1px solid #555}
      button{background:#2878ee;color:white;border:0;font-size:16px}
      .item{background:#30313a;padding:15px;margin:12px 0;border-radius:8px}
      </style>
      </head>
      <body>
      <div class="card">
      <h2>Surf Admin</h2>
      <p>Admin Dashboard</p>
      <div class="item">Welcome to Surf Admin</div>
      <div class="item">Video Management</div>
      <div class="item">User Management</div>
      <div class="item">Video Reports</div>
      <p>Dashboard is running successfully.</p>
      </div>
      </body>
      </html>
