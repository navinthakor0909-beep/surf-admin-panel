
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surf Admin Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:white;font-family:Arial;min-height:100vh;display:grid;place-items:center;padding:18px}
.card{width:100%;max-width:390px;background:#1c1c1c;padding:25px;border-radius:16px}
h2{text-align:center;margin-top:0}
p{color:#aaa;text-align:center;font-size:14px}
input{width:100%;padding:14px;margin:8px 0;background:#292929;border:1px solid #444;border-radius:8px;color:white;font-size:16px}
button{width:100%;padding:13px;margin-top:10px;border:0;border-radius:8px;background:#fff;color:#111;font-size:15px;font-weight:bold}
.secondary{background:#333;color:white}
.link{background:none;color:#ddd;text-decoration:underline}
.hidden{display:none}
#message{color:#9ee7a8;word-break:break-word}
</style>
</head>
<body>
<div class="card">
<h2>Surf Admin</h2>
<p>Admin Login Panel</p>

<div id="loginBox">
<input id="email" type="email" placeholder="Gmail">
<input id="password" type="password" placeholder="Password">
<button onclick="passwordLogin()">Password Login</button>
<button class="secondary" onclick="sendLoginOtp()">Login with OTP</button>
<button class="link" onclick="showForgot()">Forgot Password?</button>
</div>

<div id="otpBox" class="hidden">
<h3>OTP Login</h3>
<input id="loginOtp" inputmode="numeric" placeholder="Email OTP">
<button onclick="verifyLoginOtp()">Verify OTP</button>
<button class="link" onclick="showLogin()">Back to Login</button>
</div>

<div id="forgotBox" class="hidden">
<h3>Forgot Password</h3>
<input id="forgotEmail" type="email" placeholder="Gmail">
<button onclick="sendResetOtp()">Send Reset OTP</button>
<input id="resetOtp" inputmode="numeric" placeholder="OTP">
<input id="newPassword" type="password" placeholder="New Password">
<button onclick="resetPassword()">Verify OTP & Set Password</button>
<button class="link" onclick="showLogin()">Back to Login</button>
</div>

<div id="adminBox" class="hidden">
  <h2>Surf Admin Dashboard</h2>

  <button onclick="loadAdminReports()">Refresh Reports</button>
  <button class="secondary" onclick="logout()">Logout</button>

  <h3>Video Reports</h3>
  <div id="adminReports">Reports load ho rahe hain...</div>

  <div id="adminPlayerBox" class="hidden">
    <h3 id="adminVideoTitle"></h3>
    <video id="adminPlayer" controls playsinline
      style="width:100%;max-width:500px;background:#000">
    </video>
    <button class="secondary" onclick="closeAdminPlayer()">Close Video</button>
  </div>
</div>

<p id="message"></p>
</div>

<script>
const SUPABASE_URL="https://scczyiossqleuzidplxx.supabase.co";
const SUPABASE_KEY="sb_publishable_rvecUf_3ZkeAxnbAJ8iiiw_2mItGPT2";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function msg(t){document.getElementById('message').textContent=t}
function show(id){
  ['loginBox','otpBox','forgotBox','adminBox'].forEach(x=>
    document.getElementById(x).classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  msg('');
}
function showLogin(){show('loginBox')}
function showForgot(){
  document.getElementById('forgotEmail').value=
    document.getElementById('email').value;
  show('forgotBox');
}
function getEmail(){
  return document.getElementById('email').value.trim();
}
async function checkAdmin(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user)return false;
  const {data,error}=await sb.from('admin_users')
    .select('user_id').eq('user_id',user.id).maybeSingle();
  if(error||!data){
    await sb.auth.signOut();
    msg('Yeh account Admin nahi hai.');
    showLogin();
    return false;
  }
  show('adminBox');
await loadAdminReports();
return true;
}

async function passwordLogin(){
  const email=getEmail();
  const password=document.getElementById('password').value;
  if(!email||!password){msg('Gmail aur Password bharein.');return}
  msg('Login ho raha hai...');
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error){msg(error.message);return}
  await checkAdmin();
}
async function sendLoginOtp(){
  const email=getEmail();
  if(!email){msg('Pehle Gmail likhein.');return}
  msg('OTP bheja ja raha hai...');
  const {error}=await sb.auth.signInWithOtp({
    email,
    options:{shouldCreateUser:false}
  });
  if(error){msg(error.message);return}
  document.getElementById('otpBox').classList.remove('hidden');
  document.getElementById('loginBox').classList.add('hidden');
  msg('Gmail par OTP bhej diya gaya hai.');
}
async function verifyLoginOtp(){
  const email=getEmail();
  const token=document.getElementById('loginOtp').value.trim();
  if(!token){msg('OTP likhein.');return}
  msg('OTP verify ho raha hai...');
  const {error}=await sb.auth.verifyOtp({
    email,token,type:'email'
  });
  if(error){msg(error.message);return}
  await checkAdmin();
}
async function sendResetOtp(){
  const email=document.getElementById('forgotEmail').value.trim();
  if(!email){msg('Gmail likhein.');return}
  msg('Reset OTP bheja ja raha hai...');
  const {error}=await sb.auth.resetPasswordForEmail(email);
  if(error){msg(error.message);return}
  msg('Reset OTP Gmail par bhej diya gaya hai.');
}
async function resetPassword(){
  const email=document.getElementById('forgotEmail').value.trim();
  const token=document.getElementById('resetOtp').value.trim();
  const password=document.getElementById('newPassword').value;
  if(!email||!token||!password){msg('Sabhi details bharein.');return}
  if(password.length<6){msg('Password kam se kam 6 characters ka ho.');return}
  msg('OTP verify ho raha hai...');
  const {error}=await sb.auth.verifyOtp({
    email,token,type:'recovery'
  });
  if(error){msg(error.message);return}
  const {error:updateError}=await sb.auth.updateUser({password});
  if(updateError){msg(updateError.message);return}
  await sb.auth.signOut();
  showLogin();
  msg('Naya password set ho gaya. Ab login karein.');
}
async function logout(){
  await sb.auth.signOut();
  showLogin();
}
sb.auth.getSession().then(({data})=>{
  if(data.session)checkAdmin();
});
  const VIDEO_BUCKET = 'Videos';

async function isAdmin(){
  const {data:{user}} = await sb.auth.getUser();
  if(!user) return false;

  const {data,error} = await sb
    .from('admin_users')
    .select('user_id')
    .eq('user_id',user.id)
    .maybeSingle();

  return !error && !!data;
}

async function adminSignedUrl(path){
  const {data,error} = await sb.storage
    .from(VIDEO_BUCKET)
    .createSignedUrl(path,3600);

  if(error) throw error;
  return data.signedUrl;
}

async function loadAdminReports(){
  const box = document.getElementById('adminReports');
  box.textContent = 'Reports load ho rahe hain...';

  if(!await isAdmin()){
    box.textContent = 'Admin access nahi hai.';
    return;
  }

  const {data:reports,error} = await sb
    .from('video_reports')
    .select('id,video_id,reason,created_at,videos(id,title,file_path,thumbnail_path)')
    .order('created_at',{ascending:false});

  if(error){
    box.textContent = 'Error: '+error.message;
    return;
  }

  box.innerHTML = '';

  if(!reports || !reports.length){
    box.textContent = 'Abhi koi report nahi hai.';
    return;
  }

  for(const r of reports){
    const v = Array.isArray(r.videos) ? r.videos[0] : r.videos;
    const div = document.createElement('div');
    div.style.padding = '12px';
    div.style.borderBottom = '1px solid #555';

    const title = document.createElement('h3');
    title.textContent = v?.title || 'Video nahi mila';

    const reason = document.createElement('p');
    reason.textContent = 'Reason: '+r.reason;
    div.append(title,reason);

    if(v){
      if(v.thumbnail_path){
        try{
          const img = document.createElement('img');
          img.src = await adminSignedUrl(v.thumbnail_path);
          img.style.width = '180px';
          div.appendChild(img);
        }catch(e){}
      }

      const watch = document.createElement('button');
      watch.textContent = '▶ Watch Video';
      watch.onclick = () => adminWatch(v);
      div.appendChild(watch);

      const delVideo = document.createElement('button');
      delVideo.textContent = 'Delete Video';
      delVideo.onclick = () => deleteAdminVideo(v,r.id);
      div.appendChild(delVideo);
    }

    const delReport = document.createElement('button');
    delReport.textContent = 'Delete Report';
    delReport.className = 'secondary';
    delReport.onclick = () => deleteAdminReport(r.id);
    div.appendChild(delReport);

    box.appendChild(div);
  }
}

async function adminWatch(v){
  try{
    if(!await isAdmin()) return alert('Admin access nahi hai.');
    document.getElementById('adminVideoTitle').textContent = v.title || '';
    const player = document.getElementById('adminPlayer');
    player.src = await adminSignedUrl(v.file_path);
    document.getElementById('adminPlayerBox').classList.remove('hidden');
    player.play();
  }catch(e){
    alert('Video nahi khul saka: '+e.message);
  }
}

function closeAdminPlayer(){
  const player = document.getElementById('adminPlayer');
  player.pause();
  player.removeAttribute('src');
  player.load();
  document.getElementById('adminPlayerBox').classList.add('hidden');
}

async function deleteAdminReport(id){
  if(!await isAdmin()) return alert('Admin access nahi hai.');
  if(!confirm('Report delete karni hai?')) return;

  const {error} = await sb.from('video_reports').delete().eq('id',id);
  if(error) alert(error.message);
  else loadAdminReports();
}

async function deleteAdminVideo(v,reportId){
  if(!await isAdmin()) return alert('Admin access nahi hai.');
  if(!confirm('Kya aap ye video permanently delete karna chahte hain?')) return;

  const {error} = await sb.from('videos').delete().eq('id',v.id);
  if(error) return alert(error.message);

  const paths = [v.file_path,v.thumbnail_path].filter(Boolean);
  if(paths.length){
    const {error:storageError} = await sb.storage
      .from(VIDEO_BUCKET).remove(paths);
    if(storageError) alert('Video record delete hua, lekin file delete nahi hui: '+storageError.message);
  }

  await deleteAdminReport(reportId);
      }
  
</script>
</body>
</html>
