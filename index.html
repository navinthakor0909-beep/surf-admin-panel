<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surf Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#fff;font-family:Arial,sans-serif;min-height:100vh;padding:20px}
.card{width:100%;max-width:560px;margin:30px auto;background:#1c1c1c;padding:22px;border-radius:16px}
h2,h3{text-align:center}
p{color:#bbb;font-size:14px}
input{display:block;width:100%;padding:14px;margin:9px 0;background:#292929;border:1px solid #555;border-radius:8px;color:#fff;font-size:16px}
button{display:block;width:100%;padding:13px;margin-top:10px;border:0;border-radius:8px;background:#fff;color:#111;font-size:15px;font-weight:bold;cursor:pointer}
button.secondary{background:#333;color:#fff}
button.link{background:transparent;color:#ddd;text-decoration:underline;font-weight:normal}
button:disabled{opacity:.5;cursor:wait}
.hidden{display:none!important}
#message{padding:10px 0;min-height:24px;color:#9ee7a8;overflow-wrap:anywhere}
#message.error{color:#ff9b9b}
.report{padding:14px 0;border-bottom:1px solid #555}
.report small{color:#bbb}
.report button{font-size:14px}
#debug{color:#aaa;font-size:12px;overflow-wrap:anywhere}
video{width:100%;max-height:360px;background:#000;margin-top:10px}
</style>
</head>
<body>
<div class="card">
  <h2>Surf Admin</h2>
  <p style="text-align:center">Admin Login Panel</p>

  <section id="loginBox">
    <input id="email" type="email" autocomplete="username" placeholder="Gmail">
    <input id="password" type="password" autocomplete="current-password" placeholder="Password">
    <button id="passwordLoginBtn" type="button">Password Login</button>
    <button id="sendOtpBtn" class="secondary" type="button">Login with OTP</button>
    <button id="forgotBtn" class="link" type="button">Forgot Password?</button>
  </section>

  <section id="otpBox" class="hidden">
    <h3>OTP Login</h3>
    <input id="loginOtp" inputmode="numeric" autocomplete="one-time-code" placeholder="Email OTP">
    <button id="verifyOtpBtn" type="button">Verify OTP</button>
    <button id="backFromOtpBtn" class="link" type="button">Back to Login</button>
  </section>

  <section id="forgotBox" class="hidden">
    <h3>Forgot Password</h3>
    <input id="forgotEmail" type="email" autocomplete="username" placeholder="Gmail">
    <button id="sendResetBtn" type="button">Send Reset OTP</button>
    <input id="resetOtp" inputmode="numeric" autocomplete="one-time-code" placeholder="Reset OTP">
    <input id="newPassword" type="password" autocomplete="new-password" placeholder="New Password">
    <button id="resetPasswordBtn" type="button">Verify OTP & Set Password</button>
    <button id="backFromForgotBtn" class="link" type="button">Back to Login</button>
  </section>

  <section id="adminBox" class="hidden">
    <h2>Surf Admin Dashboard</h2>
    <button id="refreshReportsBtn" type="button">Refresh Reports</button>
    <button id="logoutBtn" class="secondary" type="button">Logout</button>
    <h3>Video Reports</h3>
    <div id="adminReports">Reports load ho rahe hain...</div>
    <div id="adminPlayerBox" class="hidden">
      <h3 id="adminVideoTitle"></h3>
      <video id="adminPlayer" controls playsinline></video>
      <button id="closePlayerBtn" class="secondary" type="button">Close Video</button>
    </div>
  </section>

  <p id="message" role="status" aria-live="polite"></p>
  <p id="debug">Page ready.</p>
</div>

<!-- Supabase library is loaded before the app code. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  'use strict';

  const SUPABASE_URL = 'https://scczyiossqleuzidplxx.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_rvecUf_3ZkeAxnbAJ8iiiw_2mItGPT2';
  const VIDEO_BUCKET = 'Videos';

  const $ = (id) => document.getElementById(id);
  const debug = (text) => { $('debug').textContent = text; };
  const msg = (text, isError) => {
    $('message').textContent = text || '';
    $('message').classList.toggle('error', !!isError);
  };
  const show = (id) => {
    ['loginBox','otpBox','forgotBox','adminBox'].forEach(x => $(x).classList.add('hidden'));
    $(id).classList.remove('hidden');
    msg('');
  };
  const getEmail = () => $('email').value.trim().toLowerCase();

  let sb = null;

  function setBusy(buttonId, busy) {
    const b = $(buttonId);
    if (b) b.disabled = busy;
  }

  async function checkAdmin() {
    const { data: userResult, error: userError } = await sb.auth.getUser();
    if (userError || !userResult.user) {
      show('loginBox');
      msg('Login session nahi mili. Dobara login karein.', true);
      return false;
    }

    const { data: admin, error: adminError } = await sb
      .from('admin_users')
      .select('user_id')
      .eq('user_id', userResult.user.id)
      .maybeSingle();

    if (adminError) {
      show('loginBox');
      msg('Admin check error: ' + adminError.message, true);
      return false;
    }
    if (!admin) {
      await sb.auth.signOut();
      show('loginBox');
      msg('Is Gmail ko Admin permission nahi hai.', true);
      return false;
    }

    show('adminBox');
    await loadAdminReports();
    return true;
  }

  async function passwordLogin() {
    const email = getEmail();
    const password = $('password').value;
    if (!email || !password) {
      msg('Gmail aur Password bharein.', true);
      return;
    }
    setBusy('passwordLoginBtn', true);
    msg('Login ho raha hai...');
    try {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      await checkAdmin();
    } catch (e) {
      msg(e.message || String(e), true);
    } finally {
      setBusy('passwordLoginBtn', false);
    }
  }

  async function sendLoginOtp() {
    const email = getEmail();
    if (!email) { msg('Pehle Gmail likhein.', true); return; }
    setBusy('sendOtpBtn', true);
    msg('OTP bheja ja raha hai...');
    try {
      const { error } = await sb.auth.signInWithOtp({
        email,
        options: { shouldCreateUser: false }
      });
      if (error) throw error;
      show('otpBox');
      msg('Email par OTP bhej diya gaya hai.');
    } catch (e) {
      msg(e.message || String(e), true);
    } finally {
      setBusy('sendOtpBtn', false);
    }
  }

  async function verifyLoginOtp() {
    const email = getEmail();
    const token = $('loginOtp').value.trim();
    if (!email || !token) { msg('Gmail aur OTP bharein.', true); return; }
    setBusy('verifyOtpBtn', true);
    msg('OTP verify ho raha hai...');
    try {
      const { error } = await sb.auth.verifyOtp({ email, token, type: 'email' });
      if (error) throw error;
      await checkAdmin();
    } catch (e) {
      msg(e.message || String(e), true);
    } finally {
      setBusy('verifyOtpBtn', false);
    }
  }

  async function sendResetOtp() {
    const email = $('forgotEmail').value.trim().toLowerCase();
    if (!email) { msg('Gmail bharein.', true); return; }
    setBusy('sendResetBtn', true);
    msg('Password reset OTP bheja ja raha hai...');
    try {
      const { error } = await sb.auth.resetPasswordForEmail(email);
      if (error) throw error;
      msg('Reset OTP email par bhej diya gaya hai.');
    } catch (e) {
      msg(e.message || String(e), true);
    } finally {
      setBusy('sendResetBtn', false);
    }
  }

  async function resetPassword() {
    const email = $('forgotEmail').value.trim().toLowerCase();
    const token = $('resetOtp').value.trim();
    const password = $('newPassword').value;
    if (!email || !token || !password) {
      msg('Gmail, Reset OTP aur New Password bharein.', true);
      return;
    }
    if (password.length < 6) { msg('Password kam se kam 6 characters ka ho.', true); return; }
    setBusy('resetPasswordBtn', true);
    msg('OTP verify ho raha hai...');
    try {
      const { error: verifyError } = await sb.auth.verifyOtp({ email, token, type: 'recovery' });
      if (verifyError) throw verifyError;
      const { error: updateError } = await sb.auth.updateUser({ password });
      if (updateError) throw updateError;
      msg('Password update ho gaya. Ab login karein.');
      show('loginBox');
      $('email').value = email;
    } catch (e) {
      msg(e.message || String(e), true);
    } finally {
      setBusy('resetPasswordBtn', false);
    }
  }

  async function loadAdminReports() {
    const box = $('adminReports');
    box.textContent = 'Reports load ho rahe hain...';
    try {
      const { data: reports, error } = await sb
        .from('video_reports')
        .select('id,video_id,reason,created_at')
        .order('created_at', { ascending: false })
        .limit(100);
      if (error) throw error;
      if (!reports || reports.length === 0) {
        box.textContent = 'Abhi koi video report nahi hai.';
        return;
      }
      box.innerHTML = '';
      for (const report of reports) {
        const item = document.createElement('div');
        item.className = 'report';
        const heading = document.createElement('strong');
        heading.textContent = 'Report #' + report.id;
        const reason = document.createElement('p');
        reason.textContent = 'Reason: ' + (report.reason || 'Not provided');
        const meta = document.createElement('small');
        meta.textContent = 'Video ID: ' + (report.video_id || '-') + ' | ' +
          (report.created_at ? new Date(report.created_at).toLocaleString() : '');
        const done = document.createElement('button');
        done.className = 'secondary';
        done.type = 'button';
        done.textContent = 'Report hatao';
        done.addEventListener('click', () => deleteAdminReport(report.id));
        item.append(heading, reason, meta, done);
        box.appendChild(item);
      }
    } catch (e) {
      box.textContent = 'Reports load error: ' + (e.message || String(e));
    }
  }

  async function deleteAdminReport(reportId) {
    if (!confirm('Kya is report ko list se hatana hai?')) return;
    msg('Report delete ho rahi hai...');
    try {
      const { error } = await sb.from('video_reports').delete().eq('id', reportId);
      if (error) throw error;
      msg('Report hata di gayi.');
      await loadAdminReports();
    } catch (e) {
      msg('Delete error: ' + (e.message || String(e)), true);
    }
  }

  async function logout() {
    const { error } = await sb.auth.signOut();
    if (error) msg(error.message, true);
    show('loginBox');
    msg('Logout ho gaya.');
  }

  function bind(id, handler) {
    const el = $(id);
    if (!el) throw new Error('Button missing: ' + id);
    el.addEventListener('click', function (event) {
      event.preventDefault();
      Promise.resolve(handler()).catch(e => msg(e.message || String(e), true));
    });
  }

  try {
    if (!window.supabase || !window.supabase.createClient) {
      throw new Error('Supabase library load nahi hui. Internet/CDN check karein.');
    }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    bind('passwordLoginBtn', passwordLogin);
    bind('sendOtpBtn', sendLoginOtp);
    bind('forgotBtn', () => show('forgotBox'));
    bind('verifyOtpBtn', verifyLoginOtp);
    bind('backFromOtpBtn', () => show('loginBox'));
    bind('sendResetBtn', sendResetOtp);
    bind('resetPasswordBtn', resetPassword);
    bind('backFromForgotBtn', () => show('loginBox'));
    bind('refreshReportsBtn', loadAdminReports);
    bind('logoutBtn', logout);
    bind('closePlayerBtn', () => {
      $('adminPlayer').pause();
      $('adminPlayer').removeAttribute('src');
      $('adminPlayerBox').classList.add('hidden');
    });

    debug('JavaScript loaded. Buttons connected.');
    msg('Admin panel ready. Login karein.');
    sb.auth.getSession().then(({ data }) => {
      if (data && data.session) checkAdmin();
    }).catch(e => msg(e.message || String(e), true));
  } catch (e) {
    debug('JavaScript error: ' + (e.message || String(e)));
    msg('Page setup error: ' + (e.message || String(e)), true);
  }
})();
</script>
</body>
</html>
